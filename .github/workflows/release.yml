# Release CI for opls-ff-gen (RELEASE_PLAN.md, step 7).
#
# On every run: build the wheel and sdist, check them (data present, no SI,
# version), install the built wheel into clean environments (minimal conda,
# full conda + GROMACS, pip + MOPAC from a separate prefix), run doctor, the
# unit tests and the end-to-end smoke test.
# On a tag vX.Y.Z: after all tests pass, create a DRAFT GitHub release with
# the wheel, sdist, environment files, INSTALL.md and SHA256SUMS. Review the
# draft and publish it by hand.
#
# The OPLS/2020 SI may not be redistributed, so it is never in the repository
# or the release. CI installs it from two repository secrets (Settings >
# Secrets and variables > Actions), made on your machine with:
#   xz -9e -c jp3c06602_si_002.txt | base64 -w0   ->  OPLS2020_SI_002_XZ_B64
#   xz -9e -c jp3c06602_si_003.txt | base64 -w0   ->  OPLS2020_SI_003_XZ_B64
# `opls-ff-gen install-si` then verifies them against the SHA-256 of the
# validated release. The decoded files are never printed or uploaded.

name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the release files
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="--tag $GITHUB_REF_NAME"; fi
          python src/scripts/check_dist.py dist $tag
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-conda:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env-file: environment.yml
            env-name: opls-ff-gen
            smoke-args: ""
          - env-file: environment-full.yml
            env-name: opls-ff-gen-full
            smoke-args: "--qm --expect-xtb"
            extra: gromacs     # exercises --mm-engine gromacs and the grompp tests
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: ${{ matrix.env-file }}
          activate-environment: ${{ matrix.env-name }}
          conda-remove-defaults: true
      - name: Extra conda packages
        if: matrix.extra != ''
        run: conda install -y -c conda-forge ${{ matrix.extra }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the built wheel
        run: pip install --no-deps dist/*.whl
      - name: Install the OPLS/2020 SI from secrets
        env:
          SI_002: ${{ secrets.OPLS2020_SI_002_XZ_B64 }}
          SI_003: ${{ secrets.OPLS2020_SI_003_XZ_B64 }}
        run: |
          if [[ -z "$SI_002" || -z "$SI_003" ]]; then
            echo "::error::Repository secrets OPLS2020_SI_002_XZ_B64 / OPLS2020_SI_003_XZ_B64 are not set (see the header of this workflow)"
            exit 1
          fi
          si="$RUNNER_TEMP/si"; mkdir -p "$si"
          printf '%s' "$SI_002" | base64 -d | xz -d > "$si/jp3c06602_si_002.txt"
          printf '%s' "$SI_003" | base64 -d | xz -d > "$si/jp3c06602_si_003.txt"
          opls-ff-gen install-si "$si/jp3c06602_si_002.txt" "$si/jp3c06602_si_003.txt"
          rm -rf "$si"
      - name: doctor
        run: opls-ff-gen doctor
      - name: Unit tests (against the installed wheel)
        run: python -m unittest discover -s tests
      - name: End-to-end smoke test
        run: python src/scripts/release_smoke_test.py --out "$RUNNER_TEMP/smoke" ${{ matrix.smoke-args }}
      - name: Smoke-test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.env-name }}
          path: ${{ runner.temp }}/smoke/*.log

  test-pip:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the built wheel (RDKit and NumPy from PyPI)
        run: pip install dist/*.whl
      - name: MOPAC in a separate prefix, registered with config set
        run: |
          "$CONDA/bin/conda" create -y -q -p "$RUNNER_TEMP/mopac" -c conda-forge --override-channels mopac=23.2.5
          opls-ff-gen config set mopac "$RUNNER_TEMP/mopac/bin/mopac"
      - name: Install the OPLS/2020 SI from secrets
        env:
          SI_002: ${{ secrets.OPLS2020_SI_002_XZ_B64 }}
          SI_003: ${{ secrets.OPLS2020_SI_003_XZ_B64 }}
        run: |
          if [[ -z "$SI_002" || -z "$SI_003" ]]; then
            echo "::error::Repository secrets OPLS2020_SI_002_XZ_B64 / OPLS2020_SI_003_XZ_B64 are not set (see the header of this workflow)"
            exit 1
          fi
          si="$RUNNER_TEMP/si"; mkdir -p "$si"
          printf '%s' "$SI_002" | base64 -d | xz -d > "$si/jp3c06602_si_002.txt"
          printf '%s' "$SI_003" | base64 -d | xz -d > "$si/jp3c06602_si_003.txt"
          opls-ff-gen install-si "$si/jp3c06602_si_002.txt" "$si/jp3c06602_si_003.txt"
          rm -rf "$si"
      - name: doctor
        run: opls-ff-gen doctor
      - name: "End-to-end smoke test (no xtb, so MMFF94 geometry)"
        run: python src/scripts/release_smoke_test.py --out "$RUNNER_TEMP/smoke"
      - name: Smoke-test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-pip
          path: ${{ runner.temp }}/smoke/*.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-conda, test-pip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp environment.yml environment-full.yml INSTALL.md dist/
          (cd dist && sha256sum * > SHA256SUMS)
          cat > notes.md <<EOF
          opls-ff-gen $GITHUB_REF_NAME

          Install: see INSTALL.md (conda environment + the wheel, or pip; or run
          the source code directly with \`python run_opls_ff_gen.py\`).

          The OPLS/2020 parameter files are not included (ACS Supporting
          Information, doi:10.1021/acs.jpcb.3c06602, not redistributable):
          download them from the article page and run
          \`opls-ff-gen install-si jp3c06602_si_002.txt jp3c06602_si_003.txt\`.
          MOPAC 23.2.5 is required (conda-forge \`mopac\`).

          Licence: MIT (LICENSE); two AmberTools data files are GPL-3.0 (NOTICE).
          EOF
          gh release create "$GITHUB_REF_NAME" --draft --title "opls-ff-gen $GITHUB_REF_NAME" \
            --notes-file notes.md dist/*
